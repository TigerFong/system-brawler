<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Brawler — 系统暴徒</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="viewport">
  <div id="stage">
    <div id="world">
      <canvas id="bg" class="layer" width="2560" height="1440"></canvas>
      <div id="target-layer"></div>
      <div id="weapon-layer"></div>
      <canvas id="fx" class="layer" width="2560" height="1440"></canvas>
    </div>

    <!-- HUD 层 -->
    <div id="hud">
      <div id="hp-panel">
        <div class="hud-label">SYSTEM INTEGRITY</div>
        <div id="hp-pips"></div>
        <div id="hp-text" style="font-size: 11px; margin-top: 4px; color: #5ae8ff; font-weight: bold; letter-spacing: 1px;">100 / 100</div>
      </div>
      <div id="energy-panel">
        <div class="hud-label">ULTIMATE <span id="energy-text" style="color: #c08bff; margin-left: 8px;">0 / 100</span></div>
        <div id="energy-bar-bg" style="width: 160px; height: 6px; background: rgba(0,0,0,0.5); border: 1px solid rgba(150,90,255,0.3); border-radius: 3px; margin-bottom: 12px; margin-left: auto; overflow: hidden;">
          <div id="energy-bar-fill" style="width: 0%; height: 100%; background: #c08bff; box-shadow: 0 0 10px #c08bff; transition: width 0.1s linear;"></div>
        </div>
        <div id="energy-slots"></div>
      </div>
    </div>

    <!-- 暂停按钮 -->
    <div id="btn-pause" style="position: absolute; top: 20px; left: 20px; z-index: 100; pointer-events: auto; cursor: pointer; padding: 8px 12px; background: rgba(0,0,0,0.6); border: 1px solid rgba(90,240,255,0.4); color: #5ae8ff; border-radius: 6px; font-family: monospace; font-weight: bold; letter-spacing: 1px;">
      ⏸ 暂停
    </div>

    <!-- 暂停遮罩层 -->
    <div id="pause-screen" style="display: none; position: absolute; inset: 0; background: rgba(5, 3, 11, 0.85); z-index: 200; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(4px); pointer-events: auto;">
      <h1 style="color: #5ae8ff; font-size: 36px; letter-spacing: 4px; margin-bottom: 50px; text-shadow: 0 0 20px rgba(90,240,255,0.5); font-family: monospace;">GAME PAUSED</h1>
      <button id="btn-resume" class="upgrade-btn" style="width: 200px; margin-bottom: 20px; padding: 15px; font-size: 16px; border-color: #5ee6a8; color: #5ee6a8; cursor: pointer;">继续游戏</button>
      <button id="btn-quit" class="upgrade-btn" style="width: 200px; padding: 15px; font-size: 16px; border-color: #ff5a7a; color: #ff5a7a; cursor: pointer;">退出到主菜单</button>
    </div>

    <!-- 终端 UI -->
    <div id="terminal">
      <div id="term-lines"></div>
    </div>

    <!-- 标题界面 -->
    <div id="title-screen">
      <div class="title-big">SYSTEM BRAWLER</div>
      <div class="title-sub">系统暴徒 · 双阵营原型</div>

      <!-- 阵营选择 -->
      <div class="mode-select" style="margin-bottom: 10px;">
        <div class="mode-card active" id="mode-defender" data-mode="defender">
          <div class="mode-icon">🛡️</div>
          <div class="mode-name">安全卫士</div>
          <div class="mode-desc">防守方</div>
        </div>
        <div class="mode-card" id="mode-hacker" data-mode="hacker">
          <div class="mode-icon">😈</div>
          <div class="mode-name">黑客</div>
          <div class="mode-desc">攻击方</div>
        </div>
      </div>

      <!-- 新手教程入口 -->
      <div style="display: flex; gap: 20px; margin-bottom: 30px; pointer-events: auto;">
        <div class="tutorial-btn" id="btn-tut-def" style="color:#5ae8ff; border-color:rgba(90,240,255,0.4);">▶ 卫士新手教程</div>
        <div class="tutorial-btn" id="btn-tut-hack" style="color:#ff5a7a; border-color:rgba(255,90,122,0.4);">▶ 黑客新手教程</div>
      </div>

      <!-- 功能按钮区 -->
      <div style="display: flex; gap: 16px; margin-bottom: 40px; pointer-events: auto;">
        <button class="title-action-btn" id="btn-open-rules">📖 詳細玩法说明</button>
        <button class="title-action-btn" id="btn-open-upgrades">⚙️ 系统升级</button>
        <button class="title-action-btn" id="btn-login" style="color: #5ee6a8; border-color: rgba(94,230,168,0.4);">👤 账号登录</button>
      </div>

      <div class="title-start" id="btn-start" style="margin-bottom: 20px;">点击 / 按任意键 开始无尽模式</div>
      <div class="title-start" id="btn-open-levels" style="color:#ffcc00; cursor:pointer; pointer-events:auto; margin-top: 15px; text-shadow: 0 0 15px #ffcc00; font-size: 16px;">
        ▶ 挑战关卡模式 ◀
      </div>

      <!-- 关卡选择面板 -->
      <div id="level-modal" style="display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(5px); pointer-events: auto;">
        <div style="background: #0c0818; border: 1px solid #ffcc00; padding: 30px; border-radius: 12px; width: 600px; max-width: 90vw;">
          <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
            <h3 style="color: #ffcc00; letter-spacing: 2px;">选择挑战关卡</h3>
            <div id="btn-close-levels" style="color: #888; cursor: pointer; font-size: 20px;">✕</div>
          </div>
          <div id="level-grid" style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; max-height: 60vh; overflow-y: auto;">
            <!-- JS 动态生成 50 个按钮 -->
          </div>
        </div>
      </div>

      <!-- ================= 弹窗层 ================= -->
      <div id="modal-layer" style="display: none;">
        <div id="modal-content">
          <div id="modal-close">✕</div>
          
          <!-- 玩法说明面板（默认隐藏） -->
          <div class="title-rules" id="rules-panel" style="display: none; margin-top: 0;">
            <!-- 由 JS 动态注入 -->
          </div>

          <!-- 永久升级面板（默认隐藏） -->
          <div id="upgrade-panel" style="display: none;">
            <div style="text-align: center; color: #5ee6a8; margin-bottom: 20px; font-weight: bold; letter-spacing: 2px; font-size: 18px;">
              SYS POINTS: <span id="sys-points-text">0</span>
            </div>
            
            <!-- 6 个升级按钮 -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
              <button class="upgrade-btn" id="up-hp">生命上限 +20<br><span class="up-cost">Cost: 50</span></button>
              <button class="upgrade-btn" id="up-energy">初始能量 +10<br><span class="up-cost">Cost: 80</span></button>
              <button class="upgrade-btn" id="up-chip">芯片掉率 +10%<br><span class="up-cost">Cost: 100</span></button>
              <button class="upgrade-btn" id="up-weapon">武器上限 +1<br><span class="up-cost">Cost: 150</span></button>
              <button class="upgrade-btn" id="up-duration">武器存活 +2s<br><span class="up-cost">Cost: 120</span></button>
              <button class="upgrade-btn" id="up-damage">初始伤害 +10%<br><span class="up-cost">Cost: 200</span></button>
              <button class="upgrade-btn" id="up-crit">暴击伤害 +10%<br><span class="up-cost">Cost: 150</span></button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ================= 账号登录/注册弹窗 ================= -->
    <div id="auth-modal" style="display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(4px);">
      <div style="background: #0c0818; border: 1px solid #5ee6a8; box-shadow: 0 0 30px rgba(94,230,168,0.2); padding: 30px; border-radius: 12px; width: 320px; text-align: center; position: relative;">
        <div id="btn-close-auth" style="position: absolute; top: 10px; right: 15px; color: #888; cursor: pointer; font-size: 18px;">✕</div>
        <h3 style="color: #5ee6a8; margin-bottom: 20px; letter-spacing: 2px;">SYSTEM ACCESS</h3>
        
        <input type="text" id="auth-user" placeholder="输入账号" autocomplete="off" style="width: 100%; padding: 12px; margin-bottom: 12px; background: rgba(0,0,0,0.5); border: 1px solid #5ee6a8; color: #fff; border-radius: 6px; font-family: inherit; outline: none;">
        <input type="password" id="auth-pass" placeholder="输入密码" autocomplete="off" style="width: 100%; padding: 12px; margin-bottom: 24px; background: rgba(0,0,0,0.5); border: 1px solid #5ee6a8; color: #fff; border-radius: 6px; font-family: inherit; outline: none;">
        
        <div style="display: flex; gap: 12px;">
          <button id="btn-do-login" class="upgrade-btn" style="flex: 1; padding: 10px; border-color: #5ee6a8; color: #5ee6a8;">登录</button>
          <button id="btn-do-register" class="upgrade-btn" style="flex: 1; padding: 10px; border-color: #ffaa00; color: #ffaa00;">注册</button>
        </div>
        
        <div id="auth-error" style="color: #ff5a7a; font-size: 13px; margin-top: 15px; height: 18px; font-weight: bold;"></div>
      </div>
    </div>

        <!-- 测试专用面板 (默认隐藏) -->
    <div id="tester-panel" style="display: none; position: absolute; left: 20px; bottom: 150px; top: auto; background: rgba(0,0,0,0.85); border: 1px solid #ffcc00; padding: 15px; border-radius: 8px; z-index: 100; box-shadow: 0 0 20px rgba(255,204,0,0.3);">
      <h3 style="color: #ffcc00; margin-bottom: 10px; font-size: 14px; letter-spacing: 1px;">🛠️ 开发者测试面板</h3>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <button class="upgrade-btn" id="test-add-pt" style="border-color: #5ee6a8; color: #5ee6a8; padding: 5px 10px;">+ 10000 积分</button>
        <button class="upgrade-btn" id="test-sub-pt" style="border-color: #ff5a7a; color: #ff5a7a; padding: 5px 10px;">- 10000 积分</button>
        <button class="upgrade-btn" id="test-max-up" style="border-color: #ffcc00; color: #ffcc00; padding: 5px 10px;">一键所有升级满级</button>
        <button class="upgrade-btn" id="test-add-score" style="border-color: #c08bff; color: #c08bff; padding: 5px 10px;">最高分 +100000</button>
        <button class="upgrade-btn" id="test-reset-all" style="border-color: #ff5a7a; color: #ff5a7a; padding: 5px 10px; margin-top: 10px;">☢️ 清空所有数据 (重置)</button>
      </div>
    </div>

    <!-- 闪屏特效 -->
    <div id="flash"></div>
  </div>
</div>

  <!-- 移动端触屏控制 UI -->
  <div id="mobile-ui" style="display: none;">
    <!-- 左侧虚拟摇杆 -->
    <div id="joy-zone">
      <div id="joy-stick"></div>
    </div>
    
    <!-- 右侧技能按钮 -->
    <div id="action-zone">
      <button class="mob-btn skill-btn" onclick="window.DB.handleMobileKey('shift')">技能</button>
      <div id="ult-zone">
        <button class="mob-btn ult-btn" onclick="window.DB.handleMobileKey('1')">1</button>
        <button class="mob-btn ult-btn" onclick="window.DB.handleMobileKey('2')">2</button>
        <button class="mob-btn ult-btn" onclick="window.DB.handleMobileKey('3')">3</button>
        <button class="mob-btn ult-btn" onclick="window.DB.handleMobileKey('4')">4</button>
      </div>
    </div>

    <!-- QTE 专用数字键盘（默认隐藏） -->
    <div id="qte-zone" style="display: none;">
      <button class="mob-btn qte-btn" onclick="window.DB.handleMobileKey('1')">1</button>
      <button class="mob-btn qte-btn" onclick="window.DB.handleMobileKey('2')">2</button>
      <button class="mob-btn qte-btn" onclick="window.DB.handleMobileKey('3')">3</button>
      <button class="mob-btn qte-btn" onclick="window.DB.handleMobileKey('4')">4</button>
      <button class="mob-btn qte-btn" onclick="window.DB.handleMobileKey('5')">5</button>
      <button class="mob-btn qte-btn" onclick="window.DB.handleMobileKey('6')">6</button>
      <button class="mob-btn qte-btn" onclick="window.DB.handleMobileKey('7')">7</button>
      <button class="mob-btn qte-btn" onclick="window.DB.handleMobileKey('8')">8</button>
      <button class="mob-btn qte-btn" onclick="window.DB.handleMobileKey('9')">9</button>
      <button class="mob-btn qte-btn" onclick="window.DB.handleMobileKey('0')">0</button>
    </div>
  </div>

  <!-- 全屏加载遮罩 -->
  <div id="loading-overlay" style="display: none; position: fixed; inset: 0; background: rgba(5, 3, 11, 0.95); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(5px); color: #5ae8ff; font-family: monospace;">
    <div style="font-size: 24px; font-weight: bold; letter-spacing: 2px; margin-bottom: 10px; text-shadow: 0 0 15px #5ae8ff;" id="loading-text">正在连接云端服务器...</div>
    <div style="font-size: 14px; color: rgba(150, 200, 255, 0.7); margin-bottom: 30px;" id="loading-sub">首次启动可能需要 30-50 秒唤醒，请耐心等待</div>
    
    <!-- 动画圈圈 -->
    <div style="width: 40px; height: 40px; border: 4px solid rgba(90, 240, 255, 0.2); border-top-color: #5ae8ff; border-radius: 50%; animation: spin 1s linear infinite;"></div>
  </div>

  <!-- 动画样式 -->
  <style>
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>

<!-- 加载顺序即依赖顺序，切勿随意调整 -->
<script src="js/config.js"></script>
<script src="js/dom.js"></script>
<script src="js/state.js"></script>
<script src="js/particles.js"></script>
<script src="js/weapons.js"></script>
<script src="js/enemies.js"></script>
<script src="js/player.js"></script>
<script src="js/ultimate.js"></script>
<script src="js/ui.js"></script>
<script src="js/engine.js"></script>
</body>
</html>
